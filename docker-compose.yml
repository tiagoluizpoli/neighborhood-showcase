name: neighborhood-showcase

services:
  postgres:
    image: postgres
    container_name: neighborhood-showcase-postgres
    environment:
      POSTGRES_DB: neighborhood_showcase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - neighborhood-showcase_postgres_data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neighborhood_showcase"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: neighborhood-showcase-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: neighborhood-showcase-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  unleash:
    image: unleashorg/unleash-server:latest
    container_name: neighborhood-showcase-unleash
    ports:
      - "4242:4242"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/unleash
      - DATABASE_SSL=false
      - INIT_ADMIN_API_TOKENS=default:development.unleash-insecure-api-token
      - INIT_FRONTEND_API_TOKENS=default:development.unleash-insecure-api-token
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  neighborhood-showcase_postgres_data:
  minio_data:
